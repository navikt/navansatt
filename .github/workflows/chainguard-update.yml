name: "Check for newer chainguard image versions"

on:
  workflow_dispatch:
  schedule:
    # Daily at 00:00 UTC
    - cron: "0 0 * * *"

jobs:
  digest-update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.PUF_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUF_CI_APP_PRIVATE_KEY }}
      - uses: navikt/digestabot@3302a753e533ceb9ec216de7f78345436cd636e3 # v1.2
        id: digestabot
        with:
          token: ${{ steps.app-token.outputs.token }}
          team: pensjon-saksbehandling
          branch-for-pr: PUF-Drift/update-digests
          title-for-pr: "Digestabot baseimage update"
      - name: Enable merge for digestabot PR
        if: ${{ steps.digestabot.outputs.pull_request_number != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge "${{ steps.digestabot.outputs.pull_request_number }}" --auto --merge
